  color: #C5A059;
  font-family: 'Times New Roman', Times, serif;
  font-weight: bold;
}

a {
  color: #C5A059;
  text-decoration: none;
  border-bottom: 1px dotted #C5A059;
}

code {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #C5A059;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid #333;
}

blockquote {
  border-left: 3px solid #C5A059;
  padding-left: 20px;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
  color: #bbbbbb;
  background: transparent;
}

/* --- Layout &amp; Utilities --- */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

.caption {
  font-size: 14px;
  color: #666;
  font-family: 'Helvetica Neue', sans-serif;
  margin-top: 10px;
  text-align: center;
}


/* --- Background image slides: keep text readable on left --- */
section[data-marpit-advanced-background=&quot;background&quot;] {
  --marpit-advanced-background-split: 65%;
}

/* --- iframe embed wrapper (dark deck, light frame) --- */
.embed-frame {
  background: #ffffff;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 12px;
}
.embed-frame iframe {
  display: block;
  width: 100%;
  height: 560px;
  border: 0;
}
.embed-caption {
  font-size: 14px;
  color: #888;
  margin-top: 8px;
}


/* --- Paragraph body text on content slides --- */
section p {
  line-height: 1.45;
  font-size: 22px;
  margin-top: 0.35em;
}

/* --- Footer Styling --- */
footer {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 14px;
  color: #444;
  position: absolute;
  bottom: 20px;
  width: 100%;
}

section {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 24px;
  letter-spacing: 0.02em;
  padding: 60px;
  background-color: #000000;
}

/* --- Typography: Headers --- */
h1, h2, h3 {
  font-family: 'Times New Roman', Times, serif;
  font-weight: normal;
  color: #ffffff;
  margin-bottom: 0.6em;
}

h1 {
  font-size: 64px;
  border-top: 1px solid #C5A059; /* Gold accent line */
  padding-top: 20px;
  line-height: 1.1;
}

h2 {
  font-size: 42px;
  color: #C5A059; /* Gold accent */
  border-bottom: 1px solid #333;
  padding-bottom: 10px;
}

h3 {
  font-size: 32px;
  color: #ffffff;
  font-style: italic;
}

/* --- Text Elements --- */
strong {
  color: #C5A059;
  font-family: 'Times New Roman', Times, serif;
  font-weight: bold;
}

a {
  color: #C5A059;
  text-decoration: none;
  border-bottom: 1px dotted #C5A059;
}

code {
  font-family: 'Courier New', Courier, monospace;
  background: #1a1a1a;
  color: #C5A059;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid #333;
}

blockquote {
  border-left: 3px solid #C5A059;
  padding-left: 20px;
  font-family: 'Times New Roman', Times, serif;
  font-style: italic;
  color: #bbbbbb;
  background: transparent;
}

/* --- Layout &amp; Utilities --- */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

.caption {
  font-size: 14px;
  color: #666;
  font-family: 'Helvetica Neue', sans-serif;
  margin-top: 10px;
  text-align: center;
}


/* --- Background image slides: keep text readable on left --- */
section[data-marpit-advanced-background=&quot;background&quot;] {
  --marpit-advanced-background-split: 65%;
}

/* --- iframe embed wrapper (dark deck, light frame) --- */
.embed-frame {
  background: #ffffff;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 12px;
}
.embed-frame iframe {
  display: block;
  width: 100%;
  height: 560px;
  border: 0;
}
.embed-caption {
  font-size: 14px;
  color: #888;
  margin-top: 8px;
}


/* --- Paragraph body text on content slides --- */
section p {
  line-height: 1.45;
  font-size: 22px;
  margin-top: 0.35em;
}

/* --- Footer Styling --- */
footer {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 14px;
  color: #444;
  position: absolute;
  bottom: 20px;
  width: 100%;
}
